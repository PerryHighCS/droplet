<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Droplet modern editor packages</title>
  <style>
    body { max-width: 1100px; margin: 0 auto; padding: 2rem 1rem; color: #182235; background: #f7f9fc; font: 16px/1.45 system-ui, sans-serif; }
    h1 { margin-top: 0; } .editors { display: grid; grid-template-columns: 1fr; gap: 1rem; }
    section { min-width: 0; background: white; border: 1px solid #d8e0eb; border-radius: 8px; padding: 1rem; }
    .editor { min-height: 300px; border: 1px solid #e3e9f1; } .controls { display: flex; gap: .5rem; margin-bottom: .75rem; }
    button { font: inherit; padding: .35rem .6rem; } pre { min-height: 3rem; overflow: auto; background: #f4f7fb; padding: .5rem; white-space: pre-wrap; }
    .editor-body { display: grid; grid-template-columns: minmax(150px, .42fr) minmax(0, 1fr); gap: .75rem; }
    .command-palette { display: grid; gap: .45rem; max-height: 430px; overflow: auto; }
    .palette-category summary { padding: .3rem .45rem; border-radius: 4px; color: white; font-weight: 700; cursor: pointer; }
    .palette-blocks { display: grid; gap: .35rem; padding-top: .35rem; }
    .palette-block { border: 1px solid var(--cat-stroke); background: var(--cat-fill); color: #000; cursor: grab; font: 13px ui-monospace, monospace; text-align: left; }
    .cat-control { --cat-fill: #8fbce8; --cat-stroke: #4d90d6; } .cat-control summary { background: #2f6bab; }
    .cat-math { --cat-fill: #f5c785; --cat-stroke: #efa83d; } .cat-math summary { background: #986017; } .cat-math .palette-block { border-radius: 999px; }
    .cat-variables { --cat-fill: #c3a8dd; --cat-stroke: #9c6fc4; } .cat-variables summary { background: #7649a0; }
    .cat-functions { --cat-fill: #a3d3a3; --cat-stroke: #63b563; } .cat-functions summary { background: #337533; }
    .cat-python { --cat-fill: #c5ddf1; --cat-stroke: #5e91bc; } .cat-python summary { background: #386d9b; }
    #javascript-editor [data-droplet-category="control"] > rect, #javascript-editor [data-droplet-category="control"] > path { fill: #8fbce8; stroke: #4d90d6; }
    #javascript-editor [data-droplet-category="math"] > rect, #javascript-editor [data-droplet-category="math"] > path { fill: #f5c785; stroke: #efa83d; }
    #javascript-editor [data-droplet-category="variables"] > rect, #javascript-editor [data-droplet-category="variables"] > path { fill: #c3a8dd; stroke: #9c6fc4; }
    #javascript-editor [data-droplet-category="functions"] > rect, #javascript-editor [data-droplet-category="functions"] > path { fill: #a3d3a3; stroke: #63b563; }
    /* Python containers use the wavy C-shaped spine; leave room for its
       leftward wiggles and top/footer outline instead of crowding the panel. */
    #python-editor .droplet-block-surface { padding: 14px 12px 12px 20px; }
    @media (max-width: 600px) { .editor-body { grid-template-columns: 1fr; } }
  </style>
  <script type="importmap">
    {"imports": {
      "@droplet/core": "./modules/core/index.js",
      "@droplet/codemirror-editor": "./modules/codemirror-editor/index.js",
      "@droplet/codemirror-editor/droplet": "./modules/codemirror-editor/droplet.js",
      "@droplet/editor": "./modules/editor/index.js",
      "@droplet/javascript": "./modules/javascript/index.js",
      "@droplet/python": "./modules/python/index.js",
      "acorn": "./vendor/acorn/dist/acorn.mjs",
      "@codemirror/commands": "./vendor/@codemirror/commands/dist/index.js",
      "@codemirror/language": "./vendor/@codemirror/language/dist/index.js",
      "@codemirror/state": "./vendor/@codemirror/state/dist/index.js",
      "@codemirror/view": "./vendor/@codemirror/view/dist/index.js",
      "@lezer/common": "./vendor/@lezer/common/dist/index.js",
      "@lezer/highlight": "./vendor/@lezer/highlight/dist/index.js",
      "@lezer/lr": "./vendor/@lezer/lr/dist/index.js",
      "@marijn/find-cluster-break": "./vendor/@marijn/find-cluster-break/src/index.js",
      "crelt": "./vendor/crelt/index.js", "style-mod": "./vendor/style-mod/src/style-mod.js",
      "w3c-keyname": "./vendor/w3c-keyname/index.js"
    }}
  </script>
  <script src="./vendor/brython_stdlib.js"></script>
  <script src="./vendor/brython.js"></script>
</head>
<body>
  <h1>Droplet modern editor packages</h1>
  <p>This GitHub Pages demo mounts the public ESM packages directly. Source remains authoritative in both text and block modes.</p>
  <main class="editors">
    <section><h2>JavaScript</h2><div class="controls"><button data-mode="javascript">Use text mode</button></div><div class="editor-body"><aside><h3>App Lab block set</h3><div class="command-palette" id="javascript-palette"></div></aside><div><div class="editor" id="javascript-editor"></div><h3>Exact source</h3><pre id="javascript-source"></pre></div></div></section>
    <section><h2>Python</h2><div class="controls"><button data-mode="python">Use text mode</button></div><div class="editor-body"><aside><h3>Python command palette</h3><div class="command-palette" id="python-palette"></div></aside><div><div class="editor" id="python-editor"></div><h3>Exact source</h3><pre id="python-source"></pre></div></div></section>
  </main>
  <script type="module" src="./demo.mjs"></script>
</body>
</html>
