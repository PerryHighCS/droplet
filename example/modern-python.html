<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Droplet Python playground</title>
  <style>
    body { margin: 0; color: #182235; background: #f7f9fc; font: 15px/1.4 system-ui, sans-serif; }
    header, main { max-width: 1200px; margin: auto; padding: 1rem; }
    header { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.45rem; }
    .controls { display: flex; gap: .5rem; flex-wrap: wrap; }
    button, select { font: inherit; padding: .35rem .55rem; }
    #modern-python-status { color: #3d566e; min-height: 1.4rem; }
    .panels { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 1rem; }
    .panel { min-width: 0; background: white; border: 1px solid #d8e0eb; border-radius: 6px; padding: .75rem; }
    .panel h2 { margin: 0 0 .6rem; font-size: 1rem; }
    #modern-python-editor { min-height: 360px; }
    pre { margin: 0; padding: .65rem; overflow: auto; background: #f4f7fb; border-radius: 4px; white-space: pre-wrap; }
    .droplet-block-statement { cursor: grab; }
    @media (max-width: 800px) { .panels { grid-template-columns: 1fr; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "@droplet/core": "/packages/core/src/index.js",
        "@droplet/codemirror-editor": "/packages/codemirror-editor/src/index.js",
        "@droplet/codemirror-editor/droplet": "/packages/codemirror-editor/src/droplet.js",
        "@codemirror/state": "/playwright/node_modules/@codemirror/state/dist/index.js",
        "@codemirror/view": "/playwright/node_modules/@codemirror/view/dist/index.js",
        "@codemirror/commands": "/playwright/node_modules/@codemirror/commands/dist/index.js",
        "@codemirror/language": "/playwright/node_modules/@codemirror/language/dist/index.js",
        "@lezer/common": "/playwright/node_modules/@lezer/common/dist/index.js",
        "@lezer/highlight": "/playwright/node_modules/@lezer/highlight/dist/index.js",
        "@lezer/lr": "/playwright/node_modules/@lezer/lr/dist/index.js",
        "@marijn/find-cluster-break": "/playwright/node_modules/@marijn/find-cluster-break/src/index.js",
        "crelt": "/playwright/node_modules/crelt/index.js",
        "style-mod": "/playwright/node_modules/style-mod/src/style-mod.js",
        "w3c-keyname": "/playwright/node_modules/w3c-keyname/index.js"
      }
    }
  </script>
  <script src="/playwright/node_modules/brython/brython.js"></script>
</head>
<body>
  <header>
    <h1>Modern Droplet Python playground</h1>
    <div class="controls">
      <label>Sample <select id="modern-python-sample"></select></label>
      <button id="modern-python-mode" type="button">Use block mode</button>
      <button id="modern-python-move" type="button">Move nested suite</button>
      <button id="modern-python-suite" type="button">Insert empty suite</button>
    </div>
    <output id="modern-python-status">Loading modern editor…</output>
  </header>
  <main class="panels">
    <section class="panel">
      <h2>Editor</h2>
      <p id="modern-python-help">Blue statement blocks are draggable. Drop one onto another blue statement block to move it before that statement; switch to text mode to edit raw source.</p>
      <div id="modern-python-editor"></div>
    </section>
    <section class="panel">
      <h2>Exact source</h2>
      <pre id="modern-python-source"></pre>
      <h2>Current projection</h2>
      <pre id="modern-python-projection"></pre>
    </section>
  </main>
  <script type="module" src="./modern-python.mjs"></script>
</body>
</html>
