name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  legacy-build:
    name: Legacy distribution (Node 14)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 14.x
          cache: npm
      - run: npm ci
      - run: npx grunt dist

  legacy-browser:
    name: Legacy parser and QUnit browser suite (Node 24)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm --prefix playwright ci
      - run: npm --prefix playwright exec -- playwright install --with-deps chromium
      - run: npx grunt mochaTest
      # tests/qunit-pages.spec.mjs only - the modern Python and JavaScript
      # playgrounds' own browser suites (tests/brython-ast.spec.mjs and
      # tests/javascript-playground.spec.mjs) run as their own job below,
      # under Modern verification, not here.
      - run: npm run test:browser:legacy
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-legacy-failure-diagnostics
          path: |
            playwright/test-results
            playwright/playwright-report
          if-no-files-found: ignore

  modern-playground:
    name: Modern playground (browser)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm --prefix playwright ci
      - run: npm --prefix playwright exec -- playwright install --with-deps chromium
      # modern-javascript.html's import map resolves "acorn" straight off
      # disk (see playwright/serve.mjs) from this package's own node_modules
      # - install it, or that import 404s and the JS playground never gets
      # past "Loading modern editor...".
      - run: npm --prefix packages/javascript-adapter ci
      - run: npm --prefix packages/python-adapter ci
      - run: npm --prefix packages/editor ci
      - run: npm run build:pages
      - run: npm run test:browser:modern
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-modern-failure-diagnostics
          path: |
            playwright/test-results
            playwright/playwright-report
          if-no-files-found: ignore

  modern-core:
    name: Modern core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - run: npm --prefix packages/core test

  codemirror-editor:
    name: CodeMirror editor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: packages/codemirror-editor/package-lock.json
      - run: npm --prefix packages/codemirror-editor ci
      - run: npm --prefix packages/codemirror-editor test

  javascript-adapter:
    name: Modern JavaScript adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            packages/codemirror-editor/package-lock.json
            packages/javascript-adapter/package-lock.json
      # The adapter integration test follows its local file: link into this
      # workspace, so install that workspace's runtime dependencies as well.
      - run: npm --prefix packages/codemirror-editor ci
      - run: npm --prefix packages/javascript-adapter ci
      - run: npm --prefix packages/javascript-adapter test

  python-adapter:
    name: Modern Python adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: packages/python-adapter/package-lock.json
      - run: npm --prefix packages/python-adapter ci
      - run: npm --prefix packages/python-adapter test

  legacy-verification:
    name: Legacy verification
    if: ${{ always() }}
    needs:
      - legacy-build
      - legacy-browser
    runs-on: ubuntu-latest
    steps:
      - name: Require every legacy check to pass
        env:
          LEGACY_BUILD: ${{ needs.legacy-build.result }}
          LEGACY_BROWSER: ${{ needs.legacy-browser.result }}
        run: |
          test "$LEGACY_BUILD" = success
          test "$LEGACY_BROWSER" = success

  modern-verification:
    name: Modern verification
    if: ${{ always() }}
    needs:
      - modern-core
      - codemirror-editor
      - javascript-adapter
      - python-adapter
      - modern-playground
    runs-on: ubuntu-latest
    steps:
      - name: Require every modern check to pass
        env:
          MODERN_CORE: ${{ needs.modern-core.result }}
          CODEMIRROR_EDITOR: ${{ needs.codemirror-editor.result }}
          JAVASCRIPT_ADAPTER: ${{ needs.javascript-adapter.result }}
          PYTHON_ADAPTER: ${{ needs.python-adapter.result }}
          MODERN_PLAYGROUND: ${{ needs.modern-playground.result }}
        run: |
          test "$MODERN_CORE" = success
          test "$CODEMIRROR_EDITOR" = success
          test "$JAVASCRIPT_ADAPTER" = success
          test "$PYTHON_ADAPTER" = success
          test "$MODERN_PLAYGROUND" = success
