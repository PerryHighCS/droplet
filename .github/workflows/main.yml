name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  legacy-build:
    name: Legacy distribution (Node 14)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 14.x
          cache: npm
      - run: npm ci
      - run: npx grunt dist

  legacy-and-browser:
    name: Legacy parser and browser suite (Node 24)
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm --prefix playwright ci
      - run: npm --prefix playwright exec -- playwright install --with-deps chromium
      - run: npx grunt mochaTest
      - run: npm run test:browser
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-diagnostics
          path: |
            playwright/test-results
            playwright/playwright-report
          if-no-files-found: ignore

  modern-core:
    name: Modern core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm --prefix packages/core test
